<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
h1{font-size:1.8rem;margin-bottom:8px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#888;font-size:.9rem;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:900px;width:100%}
a.card{display:block;background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:28px 24px;text-decoration:none;color:#e0e0e0;transition:all .25s}
a.card:hover{border-color:#00d4ff;transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,212,255,.15)}
.card .name{font-size:1.3rem;font-weight:700;margin-bottom:6px}
.card .cat{font-size:.8rem;color:#888;text-transform:uppercase;letter-spacing:1px}
.footer{margin-top:50px;color:#555;font-size:.75rem}
</style>
</head>
